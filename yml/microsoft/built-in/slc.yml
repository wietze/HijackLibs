  - Subject: CN=Microsoft Windows, O=Microsoft Corporation, L=Redmond, S=Washington, C=US
    Issuer: CN=Microsoft Windows Production PCA 2011, O=Microsoft Corporation, L=Redmond, S=Washington, C=US
    Type: Catalog
- Path: 'gatherosstate.exe'
  Type: Sideloading
  Condition: gatherosstate.exe is not installed by Windows; it ships on Windows 10/11
    installation media and in the Windows ADK, so it is run from wherever it was copied to
    and the application directory wins the search order. It resolves slc.dll's SLOpen export.
